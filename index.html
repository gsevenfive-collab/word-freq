<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>高频词 3000 · 英 / 德</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英语高频词">
<meta name="theme-color" content="#0a0e17">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="icons/favicon-32.png">
<style>
:root{
  --bg:#0a0e17; --bg2:#0e1420; --card:#121a29; --card2:#172034;
  --line:#212b40; --line2:#2c3854;
  --fg:#eef3fb; --fg2:#93a2ba; --fg3:#66748c;
  --acc:#5b9dff; --acc-d:#3d7fe0; --acc2:#34d9a8;
  --warn:#f7b955; --star:#ffcc4d; --bad:#ff6b81;
  --r:14px; --r-sm:10px;
  --nav-h:58px;
  --grad:linear-gradient(135deg,#5b9dff 0%,#34d9a8 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;line-height:1.5}
body.lock{overflow:hidden}
::-webkit-scrollbar{width:0;height:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
[hidden]{display:none!important}
svg{display:block}

/* ============ 顶部 ============ */
.apphead{position:sticky;top:0;z-index:40;
  background:rgba(10,14,23,.82);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid rgba(33,43,64,.9);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.titlerow{display:flex;align-items:center;gap:10px}
.titlerow h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px;
  display:flex;align-items:baseline;gap:7px}
.titlerow h1 .num{font-size:12px;font-weight:600;color:var(--fg3);
  background:var(--card2);padding:2px 7px;border-radius:20px;letter-spacing:.3px}
.titlerow .spacer{flex:1}
.iconbtn{width:34px;height:34px;border-radius:50%;background:var(--card);
  border:1px solid var(--line);display:grid;place-items:center;
  color:var(--fg2);transition:.16s;flex:none}
.iconbtn:active{transform:scale(.92);background:var(--card2)}
.iconbtn svg{width:17px;height:17px}

/* 搜索 */
.searchbox{position:relative;margin-top:10px}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--fg3);pointer-events:none}
.searchbox input{width:100%;height:38px;background:var(--card);
  border:1px solid var(--line);border-radius:11px;color:var(--fg);
  padding:0 12px 0 36px;font-size:15px;outline:none;transition:.16s}
.searchbox input::placeholder{color:var(--fg3)}
.searchbox input:focus{border-color:var(--acc);background:var(--card2)}

/* 横向滚动筛选 */
.loadmore{display:block;width:100%;margin:16px 0 6px;padding:13px;
  border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--fg2);font-size:13.5px;font-weight:600}
.loadmore:active{background:var(--card2);transform:scale(.99)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;padding-bottom:1px}
.chip{flex:none;padding:7px 13px;border-radius:20px;font-size:12.5px;
  background:var(--card);border:1px solid var(--line);color:var(--fg2);
  transition:.15s;white-space:nowrap;font-weight:500}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#06121f;font-weight:700}
.chip.reset{color:#ffb0bc;border-color:rgba(255,107,129,.35)}
.chip.reset:active{background:rgba(255,107,129,.15)}
.chip .n{opacity:.75;font-size:11.5px;margin-left:3px;font-variant-numeric:tabular-nums}
.chip.on .n{opacity:.85}

/* 概览条 */
.overview{margin-top:9px;font-size:12px;color:var(--fg3);
  display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.overview b{color:var(--acc2);font-weight:650;font-variant-numeric:tabular-nums}
.overview .sep{opacity:.4}

/* ============ 主体 ============ */
main{padding-bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom))}
.view{animation:viewIn .2s ease}
@keyframes viewIn{from{opacity:.35}to{opacity:1}}
.wrap{padding:10px 14px 0}

/* ---- 单词表 ---- */
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{position:sticky;top:0;background:#0d1422;color:var(--fg3);
  font-weight:600;font-size:12px;text-align:left;padding:9px 8px;
  border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:10}
thead th:active{color:var(--acc)}
thead th .ar{opacity:.5;font-size:9px;margin-left:2px}
tbody td{padding:10px 8px;border-bottom:1px solid rgba(33,43,64,.55);vertical-align:top}
tbody tr{transition:background .12s}
tbody tr:active{background:rgba(91,157,255,.08)}
.rk{color:var(--fg3);font-variant-numeric:tabular-nums;width:46px;font-size:12.5px}
.wd{font-weight:700;font-size:16px;color:#fff;white-space:nowrap;letter-spacing:.1px}
.wd.rich{color:var(--acc)}
.lv{display:inline-block;width:17px;height:17px;line-height:17px;text-align:center;
  border-radius:5px;font-size:10.5px;font-weight:800;margin-right:6px;vertical-align:1px;
  letter-spacing:0}
.lvA{background:rgba(52,217,168,.18);color:#5fe9c0}
.lvB{background:rgba(91,157,255,.18);color:#8fbaff}
.lvC{background:rgba(102,116,140,.2);color:#93a2ba}
.ct{color:var(--fg3);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12.5px}
.ipa{color:var(--acc2);font-family:"SF Mono",ui-monospace,"DejaVu Sans Mono",monospace;
  white-space:nowrap;font-size:12.5px;letter-spacing:-.2px}
.cn{color:var(--fg);font-size:14px;line-height:1.55}
.ex{color:var(--fg2);font-size:13px;line-height:1.6}
.ex i{font-style:normal;color:#cfdaee}
.ex em{font-style:normal;display:block;color:var(--fg3);font-size:12.5px;margin-top:3px}

/* 发音 / 收藏按钮 */
.spk{display:inline-grid;place-items:center;color:var(--acc);cursor:pointer;
  padding:3px 5px;font-size:14px;border-radius:7px;line-height:1;transition:.14s;
  vertical-align:middle}
.spk:active{transform:scale(.86);background:rgba(91,157,255,.18)}
.spkex{font-size:12px;padding:0 3px;opacity:.85}
.spkw{font-size:12.5px;padding:0 3px;opacity:.9}
.mk,.fav{display:inline-grid;place-items:center;font-size:16px;padding:3px 5px;
  border-radius:7px;color:#33405c;line-height:1;transition:.14s}
td.acts{white-space:nowrap}
td.acts .mk,td.acts .fav{width:32px;height:32px;font-size:17px;margin-left:2px}
.mk.on{color:var(--acc2)}
.fav.on{color:var(--star)}
.mk:active,.fav:active{transform:scale(.86)}
.mk.on:active{background:rgba(52,217,168,.15)}
.fav.on:active{background:rgba(255,204,77,.15)}

/* ---- 卡片通用 ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden;transition:.15s}
.card:active{border-color:var(--line2)}
.empty{padding:70px 20px;text-align:center;color:var(--fg3);font-size:13.5px;line-height:2}
.empty .big{font-size:34px;display:block;margin-bottom:10px;opacity:.5}

/* ---- 公式浏览 ---- */
.fpat{font-family:"SF Mono",ui-monospace,monospace;font-size:14px;color:var(--acc);
  line-height:1.5;word-break:break-word;letter-spacing:-.2px}
.fhead{padding:13px 14px;cursor:pointer}
.fcn{font-size:13px;color:var(--fg2);margin-top:4px;line-height:1.5}
.fmeta{display:flex;align-items:center;gap:6px;margin-top:9px;
  font-size:11.5px;color:var(--fg3)}
.fmeta .dot{opacity:.45}
.fmeta .grow{flex:1}
.fmeta .chev{font-size:9px;opacity:.6;transition:.2s;color:var(--fg3)}
.fcard.open .fmeta .chev{transform:rotate(180deg)}
.fcard.open{border-color:rgba(91,157,255,.4)}
.fbody{padding:0 14px 13px;margin-top:-2px}
.fbody .aline{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;margin-top:7px}
.aline .en{color:#e6eefa;font-size:14px;line-height:1.55}
.aline .zh{color:var(--fg3);font-size:12.5px;margin-top:3px}
.aline .tools{margin-top:4px}

/* ---- 填空练习 ---- */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px;margin-bottom:12px;box-shadow:0 10px 30px -18px #000}
.qmeta{display:flex;justify-content:space-between;align-items:center;
  color:var(--fg3);font-size:12px;margin-bottom:12px}
.qmeta b{color:var(--fg2);font-variant-numeric:tabular-nums}
.qcn{font-size:16px;color:#fff;font-weight:650;line-height:1.5;margin-bottom:8px}
.qpat{font-size:12.5px;color:var(--acc);font-family:"SF Mono",ui-monospace,monospace;
  background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 10px;margin-bottom:12px;word-break:break-word}
.qblank{font-size:15.5px;line-height:1.7;color:#e3ecfa;background:var(--bg2);
  border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px;
  word-break:break-word;letter-spacing:.1px}
.qblank .bl{color:var(--acc);letter-spacing:2px;font-weight:700}
.qlab{display:inline-block;font-family:-apple-system,sans-serif;font-size:10px;
  font-weight:700;letter-spacing:.5px;color:var(--fg3);background:var(--card2);
  border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-right:8px;
  vertical-align:2px}
.qcn{color:#fff;font-weight:650}
#qin{width:100%;height:48px;background:var(--bg2);border:1px solid var(--line2);
  color:var(--fg);border-radius:12px;padding:0 14px;font-size:16px;
  outline:none;transition:.16s;-webkit-appearance:none}
#qin::placeholder{color:var(--fg3);font-size:14px}
#qin:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(91,157,255,.14)}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.qbtns button{flex:1;min-width:92px;height:44px;border-radius:12px;font-size:14px;
  background:var(--card2);border:1px solid var(--line);color:var(--fg2);
  transition:.14s;font-weight:500}
.qbtns button:active{transform:scale(.97);background:var(--line)}
.qbtns .primary{background:var(--acc);border-color:var(--acc);color:#06121f;font-weight:700}
.qbtns .primary:active{background:var(--acc-d)}
.qbtns button.fav{border:1px solid var(--line);flex:none;min-width:0;padding:0 14px}
.qbtns button.fav.on{color:var(--star)}
.hintline{margin-top:10px;font-size:12.5px;color:var(--warn);text-align:center}
.hintline b{color:#fff;font-family:ui-monospace,monospace}
.ans{margin-top:14px;border-top:1px dashed var(--line);padding-top:13px}
.ans h4{margin:0 0 8px;font-size:11.5px;color:var(--fg3);font-weight:600;
  letter-spacing:.8px;text-transform:uppercase}
.mine{color:var(--fg2);font-size:13.5px;margin-bottom:10px;
  background:var(--bg2);border-radius:var(--r-sm);padding:9px 11px}
.mine b{color:#fff}
.tag{display:inline-block;padding:1.5px 8px;border-radius:6px;font-size:11px;
  margin-left:6px;font-weight:600;vertical-align:1px}
.tag.ok{background:rgba(52,217,168,.18);color:#6ceec8}
.tag.no{background:rgba(255,107,129,.18);color:#ffb0bc}
.ans .hl{color:var(--acc2);font-weight:700;background:rgba(52,217,168,.1);
  border-radius:3px;padding:0 2px}

/* ---- 收藏页 ---- */
.favsec{margin-bottom:22px}
.favsec h3{margin:4px 0 10px;font-size:12px;color:var(--fg3);
  font-weight:600;letter-spacing:.8px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px}
.favsec h3 .cnt{color:var(--acc2);font-variant-numeric:tabular-nums}
.fitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.fitem .main{flex:1;min-width:0}
.fitem .w{font-weight:700;font-size:15.5px;color:#fff}
.fitem .m{font-size:12.5px;color:var(--fg2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .p{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--acc)}




/* ---- 赞助页 ---- */
.sponsorview{text-align:center;padding:14px 0 26px}
.sponsorview .madeby{font-size:15px;color:var(--fg2);letter-spacing:.4px}
.sponsorview .madeby b{color:var(--fg);font-weight:800;letter-spacing:2px}
.sponsorview .footline{font-size:13.5px;color:var(--fg2);margin-top:11px;letter-spacing:.6px}
.sponsorview .footnote{font-size:11px;color:#4d5a72;margin-top:7px;line-height:1.6}
.sponsorview img{width:76%;max-width:280px;border-radius:14px;display:block;
  margin:20px auto 10px;background:#fff;box-shadow:0 8px 30px -14px #000}
.sponsorview .tip{font-size:12px;color:var(--fg3);letter-spacing:.5px}


/* ---- 返回按钮 / 语言选择 ---- */
.backbtn{width:34px;height:34px;border-radius:50%;background:var(--card);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--fg2);
  flex:none;margin-right:3px}
.backbtn svg{width:18px;height:18px}
.backbtn:active{transform:scale(.92);background:var(--card2)}
.pickwrap{padding:calc(20px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
  min-height:100vh;display:flex;flex-direction:column}
.pickhead{margin:8px 4px 20px}
.pickhead h2{margin:0 0 7px;font-size:22px;font-weight:700;letter-spacing:.3px}
.pickhead p{margin:0;font-size:13px;color:var(--fg3);line-height:1.6}
.pickcard{display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  margin-bottom:12px;transition:.15s}
.pickcard:active{transform:scale(.98);border-color:var(--acc)}
.pickcard.loading{opacity:.55}
.pickcard.loading .pc-meta::after{content:' · 载入中…';color:var(--acc)}
.pickcard.failed{border-color:var(--bad)}
.pickcard.failed .pc-meta::after{content:' · 加载失败，请检查网络';color:var(--bad)}
.pc-name{font-size:19px;font-weight:700;color:#fff;display:flex;align-items:baseline;gap:10px}
.pc-sub{font-size:13px;font-weight:400;color:var(--fg3);letter-spacing:.6px}
.pc-meta{margin-top:8px;font-size:12.5px;color:var(--fg2)}
.pickfoot{margin-top:auto;padding-top:34px;text-align:center}
.pickfoot .madeby{font-size:13px;color:var(--fg2)}
.pickfoot .madeby b{color:var(--fg);font-weight:800;letter-spacing:1.5px}
.pickfoot .footline{font-size:12.5px;color:var(--fg3);margin-top:7px;letter-spacing:.5px}
.pickfoot .footnote{font-size:10.5px;color:#4d5a72;margin-top:5px}
.pickspon{margin-top:14px;padding:10px 26px;border-radius:22px;font-size:13.5px;
  font-weight:600;background:rgba(255,204,77,.12);border:1px solid rgba(255,204,77,.42);
  color:var(--star);transition:.15s}
.pickspon:active{transform:scale(.96);background:rgba(255,204,77,.24)}
.pickqr{margin-top:16px}
.pickqr img{width:74%;max-width:250px;border-radius:12px;display:block;
  margin:0 auto 8px;background:#fff}
.pickqr .tip{font-size:12px;color:var(--fg3);letter-spacing:.5px}


/* ============ 底部导航 ============ */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;justify-content:center;
  padding:0 0 env(safe-area-inset-bottom);
  background:rgba(10,14,23,.9);backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  border-top:1px solid rgba(33,43,64,.9)}
.bottomnav .inner{display:flex;width:100%;max-width:640px;height:var(--nav-h)}
.navbtn{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--fg3);transition:.16s;
  position:relative;padding-bottom:2px}
.navbtn svg{width:21px;height:21px;transition:.16s}
.navbtn span{font-size:10.5px;font-weight:600;letter-spacing:.2px}
.navbtn.on{color:var(--acc)}
.navbtn.on svg{transform:translateY(-1px)}
.navbtn:active svg{transform:scale(.88)}
.navbtn .badge{position:absolute;top:7px;right:calc(50% - 20px);
  min-width:15px;height:15px;border-radius:8px;background:var(--bad);color:#fff;
  font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* ============ 信息弹层 ============ */
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;
  justify-content:center;background:rgba(3,6,12,.72);animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheetpanel{width:100%;max-width:560px;background:var(--card);
  border-radius:22px 22px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:82vh;overflow:auto;box-shadow:0 -18px 50px -20px #000}
.sheetgrab{width:38px;height:4px;border-radius:3px;background:var(--line2);
  margin:6px auto 14px}
.sheetpanel h3{margin:0 0 14px;font-size:16px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.kv:last-of-type{border-bottom:none}
.kv .k{color:var(--fg3);flex:none}
.kv .v{color:var(--fg);text-align:right;word-break:break-word}
.sheetpanel .act{display:flex;gap:9px;margin-top:16px}
.sheetpanel .act button{flex:1;height:44px;border-radius:12px;
  background:var(--card2);border:1px solid var(--line);color:var(--fg2);font-size:14px}
.sheetpanel .act button.danger{color:#ffb0bc;border-color:rgba(255,107,129,.35)}

/* 安装提示 */
.installhint{margin:10px 14px 0;padding:11px 13px;border-radius:12px;
  background:rgba(91,157,255,.1);border:1px solid rgba(91,157,255,.3);
  color:#cfe1ff;font-size:12.5px;line-height:1.65;display:none}
.installhint b{color:#fff}
.installhint .x{float:right;margin-left:8px;padding:2px 9px;font-size:11.5px;
  border-radius:7px;background:rgba(91,157,255,.18);color:#cfe1ff}

/* ============ 手机端卡片式单词 ============ */
@media(max-width:820px){
  .apphead{padding-left:14px;padding-right:14px}
  thead{display:block}
  thead tr{display:flex;gap:6px;padding:9px 14px 7px;overflow-x:auto;
    border-bottom:1px solid var(--line);scrollbar-width:none}
  thead tr::-webkit-scrollbar{display:none}
  thead th{display:inline-block;flex:none;width:auto!important;padding:5px 11px;
    font-size:11.5px;background:var(--card);border:1px solid var(--line);
    border-radius:20px;font-weight:500}
  thead th:nth-child(7){display:none}
  table,tbody{display:block}
  tbody tr{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 5px;
    padding:12px 14px;border-bottom:1px solid rgba(33,43,64,.55);background:none}
  tbody td{display:block;border:none;padding:0;width:auto}
  /* 序号与单词一起贴最左 */
  td.rk{order:1;font-size:11.5px;color:var(--fg3);text-align:left;
    width:auto!important;min-width:0;max-width:none;padding:0}
  td:nth-child(2){order:2}
  /* 音标、次数往左靠，把右边空间让给掌握/收藏 */
  td.ipa{order:3}
  td.ct{order:4;font-size:11.5px}
  td.cn{order:7;flex-basis:100%;margin-top:5px;font-size:14.5px}
  td.ex{order:8;flex-basis:100%;margin-top:5px;display:block}
  /* 掌握/收藏靠右，与单词同一行 */
  td.acts{order:5;margin-left:auto;display:flex;gap:8px}
  td.acts .mk,td.acts .fav{font-size:19px;min-width:44px;min-height:40px;
    border-radius:10px;border:1px solid var(--line);background:var(--card2)}
  .wd{white-space:normal;font-size:16.5px}
  td:nth-child(2) .wd{margin-right:5px}

<script>
/* 语言包元信息（选择页用，不需要下载数据） */
const PACK_META = {
  en: { name: '英语', sub: 'English', words: 3000, formulas: 183, quiz: 1051 },
  de: { name: '德语', sub: 'Deutsch', words: 3000, formulas: 0, quiz: 0 }
};
const PACKS = {};                 /* 已加载的语言包缓存 */
async function loadPack(lang){
  if (PACKS[lang]) return PACKS[lang];
  const res = await fetch('data/' + lang + '.json', { cache: 'force-cache' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  PACKS[lang] = await res.json();
  return PACKS[lang];
}
const K_HINT = 'wf-hide-install-hint';
const K_LAST = 'wf-last-lang';
const $ = id => document.getElementById(id);

let LANG = null;
let DATA = [], FORMULAS = [], ALL_BLANK = [];
let nf = new Intl.NumberFormat('en-US');
let mastered = new Set(), masteredForms = new Set(), favWords = new Set(), favForms = new Set(), quizRec = {};

/* 每门语言独立的存储键，进度/收藏互不干扰 */
function sk(name){ return 'wf-' + LANG + '-' + name; }
function loadState(){
  mastered = new Set(JSON.parse(localStorage.getItem(sk('mastered')) || '[]'));
  favWords = new Set(JSON.parse(localStorage.getItem(sk('favw'))    || '[]'));
  favForms = new Set(JSON.parse(localStorage.getItem(sk('favf'))    || '[]'));
  masteredForms = new Set(JSON.parse(localStorage.getItem(sk('masteredf')) || '[]'));
  quizRec  = JSON.parse(localStorage.getItem(sk('quiz'))            || '{}');
}
function saveAll(){
  localStorage.setItem(sk('mastered'), JSON.stringify([...mastered]));
  localStorage.setItem(sk('favw'), JSON.stringify([...favWords]));
  localStorage.setItem(sk('favf'), JSON.stringify([...favForms]));
  localStorage.setItem(sk('masteredf'), JSON.stringify([...masteredForms]));
  localStorage.setItem(sk('quiz'), JSON.stringify(quizRec));
}
function rebuildBlankPool(){
  ALL_BLANK = [];
  FORMULAS.forEach((f, i) => f.ex.forEach((e, k) => { if (e.quiz) ALL_BLANK.push(i + ':' + k); }));
}

let tab = 'words';
let sortKey = 'r', sortAsc = true, filter = 'all', query = '';
let lastSpoken = null, lastRate = 0.9;
let fbFilter = 'all', fbQuery = '', openSet = new Set();
let qFilter = 'all', qPos = 0, qRevealed = null, qLastInput = '', qHinted = false;

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function norm(s){
  return (s || '').toLowerCase()
    .replace(/[’‘`]/g, "'").replace(/[“”]/g, '"')
    .replace(/[.,!?;:，。！？；：、"]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

/* ================= 语音 ================= */
let voices = [], ttsVoice = null;
/* 云端语音（名称带 Online / Natural / Neural）常常忽略 rate，慢速会失效。
   本地语音才稳定支持变速，所以优先选本地。 */
const CLOUD_VOICE = /online|natural|neural/i;
const VOICE_CFG = {
  en: { lang: 'en-US', re: /^en/i, pref: /samantha|zira|david|mark|ava|allison|susan|daniel|karen|moira|aria|jenny/i },
  de: { lang: 'de-DE', re: /^de/i, pref: /anna|petra|markus|katja|helena|stefan|felix|marlene|vicki|conrad/i }
};

function pickVoice(){
  voices = speechSynthesis.getVoices();
  const cfg = VOICE_CFG[LANG || 'en'];
  const en = voices.filter(v => cfg.re.test(v.lang));
  const local = en.filter(v => !CLOUD_VOICE.test(v.name));
  const pref = /samantha|zira|david|mark|ava|allison|susan|daniel|karen|moira/i;

  ttsVoice =
       local.find(v => v.lang.replace('_','-').toLowerCase() === cfg.lang.toLowerCase() && cfg.pref.test(v.name))
    || local.find(v => v.lang.replace('_','-').toLowerCase() === cfg.lang.toLowerCase())
    || local[0]
    || en[0]
    || null;

  const el = $('voiceinfo');
  if (el){
    if (!voices.length){
      el.textContent = '语音引擎加载中…';
      el.style.color = '#f7b955';
    } else if (!ttsVoice){
      el.textContent = '未找到该语言语音，使用系统默认';
      el.style.color = '#f7b955';
    } else {
      const cloud = CLOUD_VOICE.test(ttsVoice.name);
      el.textContent = ttsVoice.name + ' (' + ttsVoice.lang + ')'
        + (cloud ? ' · 云端语音，变速可能无效' : ' · 本地语音');
      el.style.color = cloud ? '#f7b955' : '#34d9a8';
    }
  }
}
speechSynthesis.onvoiceschanged = pickVoice;
let voiceRetried = false;
function retryVoiceOnce(){
  if (voiceRetried) return;
  voiceRetried = true;
  setTimeout(pickVoice, 120);
}
document.addEventListener('touchend', retryVoiceOnce, { once:true, passive:true });
document.addEventListener('click', retryVoiceOnce, { once:true });
pickVoice();

let speakTimer = null;
function speak(text, rowEl, rate){
  if (!text) return;
  const r = (typeof rate === 'number' && rate > 0) ? rate : 0.9;
  /* 单个字母交给 TTS 会被读成「字母名」甚至「capital I」（iOS 实测）。
     只用同音词替换这两个词，其余原样。 */
  const SPEAK_FIX = { 'I': 'eye', 'a': 'uh' };
  const spoken = (SPEAK_FIX[text] !== undefined && text.length === 1) ? SPEAK_FIX[text] : text;
  const u = new SpeechSynthesisUtterance(spoken);
  u.lang = (VOICE_CFG[LANG || 'en'] || VOICE_CFG.en).lang;
  u.rate = r;
  u.pitch = 1;
  u.volume = 1;
  if (ttsVoice) u.voice = ttsVoice;
  if (rowEl){
    rowEl.classList.add('speaking');
    setTimeout(() => rowEl.classList.remove('speaking'), 1100);
  }
  lastSpoken = text; lastRate = r;
  /* cancel() 之后立刻 speak() 会让 rate 丢失（Chromium/iOS 已知问题），
     先取消、等一拍、再发声。 */
  if (speakTimer) clearTimeout(speakTimer);
  try { speechSynthesis.cancel(); } catch (e) {}
  speakTimer = setTimeout(() => {
    speakTimer = null;
    try { speechSynthesis.speak(u); } catch (e) {}
  }, 70);
}

/* ================= 单词 ================= */
function visibleWords(){
  let rows = DATA;
  /* 选「已掌握」时只显示已掌握的；其余筛选都先把已掌握的隐去 */
  if (filter === 'mastered') rows = rows.filter(d => mastered.has(d.w));
  else rows = rows.filter(d => !mastered.has(d.w));
  if (filter === 'a') rows = rows.filter(d => d.lv === 'A');
  else if (filter === 'b') rows = rows.filter(d => d.lv === 'B');
  else if (filter === 'c') rows = rows.filter(d => d.lv === 'C');
  if (query){
    const q = query.toLowerCase();
    rows = rows.filter(d => d.w.toLowerCase().includes(q)
      || (d.cn || '').toLowerCase().includes(q) || (d.ex || '').toLowerCase().includes(q));
  }
  const dir = sortAsc ? 1 : -1;
  return rows.slice().sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (sortKey === 'r' || sortKey === 'c') return (x - y) * dir;
    return String(x).localeCompare(String(y), 'en') * dir;
  });
}

let WORD_ROWS = [], WORD_SHOWN = 0;
const WORD_CHUNK = 60;

function wordRowHtml(d){
  return `
    <tr data-w="${esc(d.w)}" class="${mastered.has(d.w) ? 'done' : ''}">
      <td class="rk">${d.r}</td>
      <td><span class="wd ${d.ipa ? 'rich' : ''}"
          data-say="${esc(d.w)}">${esc(d.w)}</span><span class="lv lv${d.lv}">${d.lv}</span><button class="spk" data-say="${esc(d.w)}">🔊</button><button class="spk spkw" data-say="${esc(d.w)}" data-rate="0.45">🐢</button></td>
      <td class="ct">${nf.format(d.c)}</td>
      <td class="ipa">${esc(d.ipa) || '—'}</td>
      <td class="cn">${esc(d.cn) || '<span style="color:#66748c">待补充</span>'}</td>
      <td class="ex">${d.ex ? `<i>${esc(d.ex)}</i><button class="spk spkex" data-say="${esc(d.ex)}" data-rate="0.6">🐢</button><button class="spk spkex" data-say="${esc(d.ex)}" data-rate="1">🗣️</button><em>${esc(d.excn)}</em>` : '<span style="color:#66748c">—</span>'}</td>
      <td class="acts"><button class="mk ${mastered.has(d.w) ? 'on' : ''}" data-mk="${esc(d.w)}" title="标记已掌握">${mastered.has(d.w) ? '★' : '☆'}</button><button class="fav ${favWords.has(d.w) ? 'on' : ''}" data-fav="${esc(d.w)}" title="收藏">${favWords.has(d.w) ? '♥' : '♡'}</button></td>
    </tr>`;
}

function appendWordChunk(){
  if (WORD_SHOWN >= WORD_ROWS.length) return;
  const next = WORD_ROWS.slice(WORD_SHOWN, WORD_SHOWN + WORD_CHUNK);
  WORD_SHOWN += next.length;
  $('tb').insertAdjacentHTML('beforeend', next.map(wordRowHtml).join(''));
  const more = $('more');
  if (more) more.hidden = WORD_SHOWN >= WORD_ROWS.length;
}

/* keepShown=true 时保持已展开的行数（避免点掌握/收藏后列表跳回顶部） */
function renderWords(keepShown){
  const prev = keepShown ? WORD_SHOWN : 0;
  WORD_ROWS = visibleWords();
  WORD_SHOWN = 0;
  $('tb').innerHTML = '';
  $('empty').hidden = WORD_ROWS.length > 0;
  appendWordChunk();
  while (keepShown && WORD_SHOWN < prev && WORD_SHOWN < WORD_ROWS.length) appendWordChunk();
  const rows = WORD_ROWS;

  $('c-all').textContent = DATA.length;
  $('c-a').textContent = DATA.filter(d => d.lv === 'A').length;
  $('c-mastered').textContent = mastered.size;
  $('stats').innerHTML = `显示 <b>${rows.length}</b> 词`
    + `<span class="sep">·</span>已掌握 <b>${mastered.size}</b>`
    + `<span class="sep">·</span>收藏 <b>${favWords.size}</b>`;
  $('hd-num').textContent = DATA.length;
  updateFavBadge();
}

/* ================= 公式浏览 ================= */
function fbList(){
  let rows = FORMULAS.map((_, i) => i);
  /* 选「已掌握」时只显示已掌握的；其余筛选都先把已掌握的隐去 */
  if (fbFilter === 'mastered') rows = rows.filter(i => masteredForms.has(i));
  else rows = rows.filter(i => !masteredForms.has(i));
  if (fbFilter === 'fav') rows = rows.filter(i => favForms.has(i));
  if (fbQuery){
    const q = fbQuery.toLowerCase();
    rows = rows.filter(i => {
      const f = FORMULAS[i];
      return (f.p || '').toLowerCase().includes(q) || (f.pcn || '').includes(fbQuery)
        || f.ex.some(e => (e.en || '').toLowerCase().includes(q) || (e.cn || '').includes(fbQuery));
    });
  }
  return rows;
}

function renderFormula(){
  const rows = fbList();
  const totalEx = FORMULAS.reduce((n, f) => n + f.ex.length, 0);
  $('c-fb').textContent = FORMULAS.length - masteredForms.size;
  $('c-fbmas').textContent = masteredForms.size;
  $('c-fbfav').textContent = favForms.size;
  $('fbstats').innerHTML = `共 <b>${FORMULAS.length}</b> 个公式<span class="sep">·</span>例句 <b>${totalEx}</b> 条`
    + `<span class="sep">·</span>显示 <b>${rows.length}</b> 个`;
  const box = $('view-formula');
  if (!rows.length){
    box.innerHTML = '<div class="empty"><span class="big">🧩</span>没有匹配的公式</div>';
    return;
  }
  box.innerHTML = rows.map(i => {
    const f = FORMULAS[i];
    const open = openSet.has(i);
    const qn = f.ex.filter(e => e.quiz).length;
    return `<div class="card fcard${open ? ' open' : ''}">
      <div class="fhead" data-toggle="${i}">
        <div class="fpat">${esc(f.p)}</div>
        <div class="fcn">${esc(f.pcn || '（无中文提示）')}</div>
        <div class="fmeta">
          <span>${f.ex.length} 例</span><span class="dot">·</span><span>可填 ${qn}</span>
          <span class="grow"></span>
          <button class="mk ${masteredForms.has(i) ? 'on' : ''}" data-fmk="${i}" title="标记已掌握">${masteredForms.has(i) ? '★' : '☆'}</button>
          <button class="fav ${favForms.has(i) ? 'on' : ''}" data-qfav="${i}" title="收藏">${favForms.has(i) ? '♥' : '♡'}</button>
          <span class="chev">▼</span>
        </div>
      </div>
      ${open ? `<div class="fbody">` + f.ex.map(e => `
        <div class="aline">
          <div class="en">${esc(e.en)}</div>
          <div class="zh">${esc(e.cn)}</div>
          <div class="tools">
            <button class="spk" data-say="${esc(e.en)}">🔊</button>
            <button class="spk spkex" data-say="${esc(e.en)}" data-rate="0.6">🐢</button>
          </div>
        </div>`).join('') + `</div>` : ''}
    </div>`;
  }).join('');
}

/* ================= 填空 ================= */

FORMULAS.forEach((f, i) => f.ex.forEach((e, k) => { if (e.quiz) ALL_BLANK.push(i + ':' + k); }));

function fOf(key){ return FORMULAS[parseInt(key.split(':')[0], 10)]; }
function eOf(key){
  const p = key.split(':');
  return FORMULAS[parseInt(p[0], 10)].ex[parseInt(p[1], 10)];
}

function blankPool(){
  let idx = ALL_BLANK.map((_, i) => i);
  if (qFilter === 'new') idx = idx.filter(k => !quizRec[ALL_BLANK[k]]);
  else if (qFilter === 'wrong') idx = idx.filter(k => quizRec[ALL_BLANK[k]] && quizRec[ALL_BLANK[k]].s === 'no');
  else if (qFilter === 'fav') idx = idx.filter(k => favForms.has(parseInt(ALL_BLANK[k].split(':')[0], 10)));
  return idx;
}

function renderBlank(){
  const recs = Object.values(quizRec);
  const done = recs.length, right = recs.filter(r => r.s === 'yes').length, wrong = recs.filter(r => r.s === 'no').length;
  $('c-qall').textContent = ALL_BLANK.length;
  $('c-qnew').textContent = Math.max(0, ALL_BLANK.length - done);
  $('c-qwrong').textContent = wrong;
  $('c-qfav').textContent = favForms.size;
  $('qstats').innerHTML = `可做 <b>${ALL_BLANK.length}</b> 句<span class="sep">·</span>已做 <b>${done}</b>`
    + `<span class="sep">·</span>正确率 <b>${done ? Math.round(right / done * 100) : 0}%</b>`;

  const pool = blankPool();
  const box = $('qcard');
  if (!pool.length){
    box.innerHTML = '<div class="empty"><span class="big">✍️</span>这个题库现在是空的<br>换个筛选条件试试</div>';
    return;
  }
  if (qPos >= pool.length) qPos = 0;
  const key = ALL_BLANK[pool[qPos]];
  const f = fOf(key), e = eOf(key);
  const rec = quizRec[key];
  const words = e.a.split(/\s+/).length;

  let body;
  if (qRevealed === null){
    body = `<input id="qin" type="text" autocomplete="off" autocapitalize="off"
              spellcheck="false" placeholder="按上面的中文，填出 ____ 部分（${words} 个词）" value="${esc(qLastInput)}">
      <div class="qbtns">
        <button class="primary" id="submit">提交</button>
        <button id="hint">提示</button>
        <button id="qskip">跳过</button>
      </div>
      ${qHinted ? `<div class="hintline">首字母 <b>${esc(e.a[0])}</b> ｜ ${words} 个词 ｜ 共 ${e.a.length} 字符</div>` : ''}`;
  } else {
    const fi = parseInt(key.split(':')[0], 10);
    body = `<div class="ans">
      <div class="mine">你填的：<b>${qLastInput ? esc(qLastInput) : '（空）'}</b>
        <span class="tag ${qRevealed === 'yes' ? 'ok' : 'no'}">${qRevealed === 'yes' ? '✓ 对了' : '✗ 错了'}</span></div>
      <h4>正确答案</h4>
      <div class="aline">
        <div class="en">${highlight(e.en, e.a)}</div>
        <div class="zh">${esc(e.cn)}</div>
        <div class="tools">
          <button class="spk" data-say="${esc(e.en)}">🔊</button>
          <button class="spk spkex" data-say="${esc(e.en)}" data-rate="0.6">🐢</button>
          <button class="spk spkex" data-say="${esc(e.a)}" data-rate="0.6">🐢答案</button>
        </div>
      </div>
      <div class="qbtns">
        <button class="primary" id="nextq">下一题</button>
        <button id="againq">重做</button>
        ${qRevealed === 'no' ? '<button id="imright">算我对</button>' : ''}
        <button class="fav ${favForms.has(fi) ? 'on' : ''}" data-qfav="${fi}">${favForms.has(fi) ? '♥' : '♡'}</button>
      </div>
    </div>`;
  }

  box.innerHTML = `<div class="qcard">
    <div class="qmeta">
      <span>第 <b>${qPos + 1}</b> / ${pool.length}</span>
      <span>${rec ? `<span class="tag ${rec.s === 'yes' ? 'ok' : 'no'}">${rec.s === 'yes' ? '上次对' : '上次错'}</span>` : ''}</span>
    </div>
    <div class="qcn">${esc(e.cn || f.pcn || '（无中文提示）')}</div>
    <div class="qpat"><span class="qlab">公式</span>${esc(f.p)}</div>
    <div class="qblank"><span class="qlab">题目</span>${esc(e.q).replace(/_{2,}/, '<b class="bl">____</b>')}</div>
    ${body}
  </div>`;

  if (qRevealed === null){
    const inp = $('qin');
    if (inp){
      inp.addEventListener('input', () => { qLastInput = inp.value; });
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter'){ ev.preventDefault(); doSubmit(); } });
    }
  } else {
    const nx = $('nextq'), ag = $('againq');
    if (nx) nx.onclick = () => { qPos++; qRevealed = null; qLastInput = ''; qHinted = false; renderBlank(); };
    if (ag) ag.onclick = () => { qRevealed = null; qLastInput = ''; qHinted = false; renderBlank(); };
  }
}

function highlight(full, ans){
  const i = String(full).toLowerCase().indexOf(String(ans).toLowerCase());
  if (i < 0) return esc(full);
  return esc(full.slice(0, i)) + '<b class="hl">' + esc(full.slice(i, i + ans.length)) + '</b>' + esc(full.slice(i + ans.length));
}

function stripArticles(s){
  return norm(s).replace(/^(a|an|the)\s+/, '');
}

function doSubmit(){
  const pool = blankPool();
  if (!pool.length) return;
  const key = ALL_BLANK[pool[qPos]];
  const e = eOf(key);
  const n = norm(qLastInput);
  // 中文意思已经锁定这一句，所以只认这一条的答案；冠词 a/an/the 差异放行
  const ok = !!n && (
       n === norm(e.a)
    || n === norm(e.en)
    || stripArticles(qLastInput) === stripArticles(e.a)
  );
  qRevealed = ok ? 'yes' : 'no';
  quizRec[key] = { s: qRevealed, at: Date.now() };
  saveAll();
  renderBlank();
}

/* ================= 收藏页 ================= */
function renderFav(){
  const ws = [...favWords].map(w => DATA.find(d => d.w === w)).filter(Boolean)
    .sort((a, b) => a.r - b.r);
  const fs = [...favForms].sort((a, b) => a - b);
  const box = $('favbody');
  if (!ws.length && !fs.length){
    box.innerHTML = '<div class="empty"><span class="big">♥</span>还没有收藏<br>单词点 ♡、公式点 ♡ 就会出现在这里</div>';
    return;
  }
  let html = '';
  if (ws.length){
    html += `<div class="favsec"><h3>单词 <span class="cnt">${ws.length}</span></h3>`
      + ws.map(d => `<div class="fitem">
          <div class="main"><div class="w">${esc(d.w)}</div>
          <div class="m">${esc(d.cn)}</div></div>
          <button class="spk" data-say="${esc(d.w)}">🔊</button>
          <button class="fav on" data-fav="${esc(d.w)}">♥</button>
        </div>`).join('') + `</div>`;

            <div class="m">${esc(f.pcn || '')} · ${f.ex.length} 例</div></div>
            <button class="fav on" data-qfav="${i}">♥</button>
          </div>`;

  }
  box.innerHTML = html;
}

function updateFavBadge(){
  const n = favWords.size + favForms.size;
  const b = $('navfav');

/* ================= 语言 ================= */
function renderPicker(){
  const box = $('pickcards');
  box.innerHTML = Object.keys(PACK_META).map(k => {
    const p = PACK_META[k];
    return `<button class="pickcard" data-lang="${k}">
      <div class="pc-name">${p.name}<span class="pc-sub">${p.sub}</span></div>
      <div class="pc-meta">${p.words} 词${p.quiz ? ' · ' + p.formulas + ' 公式 / ' + p.quiz + ' 道填空' : ''}</div>
    </button>`;

async function enterLang(lang){
  const card = document.querySelector('.pickcard[data-lang="' + lang + '"]');
  if (card && !PACKS[lang]) card.classList.add('loading');
  let pack;
  try {
    pack = await loadPack(lang);
  } catch (e) {
    if (card){ card.classList.remove('loading'); card.classList.add('failed'); }
    return;
  }
  if (card) card.classList.remove('loading');
  LANG = lang;
  DATA = pack.words;
  FORMULAS = pack.formulas || [];
  rebuildBlankPool();
  loadState();
  nf = new Intl.NumberFormat(lang === 'de' ? 'de-DE' : 'en-US');

  /* 顶部标题 */
  $('hd-lang').textContent = pack.name + '高频词';
  $('hd-num').textContent = DATA.length;
  $('btn-back').hidden = false;
  document.documentElement.lang = lang === 'de' ? 'de' : 'zh-CN';
  document.title = pack.name + '高频词 3000';

  /* 导航：没有公式的语言隐藏「公式 / 填空」*/
  const hasQuiz = FORMULAS.length > 0;
  document.querySelectorAll('.navbtn').forEach(b => {
    const t = b.dataset.tab;
    b.hidden = (t === 'formula' || t === 'blank') && !hasQuiz;
  });

  /* 记住选择 */
  localStorage.setItem(K_LAST, lang);

  /* 重置子状态 */
  filter = 'all'; query = ''; sortKey = 'r'; sortAsc = true;
  fbFilter = 'all'; fbQuery = ''; openSet = new Set();
  qFilter = 'all'; qPos = 0; qRevealed = null; qLastInput = ''; qHinted = false;
  const q = $('q'); if (q) q.value = '';
  document.querySelectorAll('#ctl-words .chip').forEach(b => b.classList.remove('on'));
  const fa = $('f-all'); if (fa) fa.classList.add('on');

  pickVoice();
  showApp();
  setTab('words');
}

  document.querySelector('.bottomnav').hidden = false;

  const standalone = window.navigator.standalone === true
    || window.matchMedia('(display-mode: standalone)').matches;

const RENDER = { words: renderWords, formula: renderFormula, blank: renderBlank,
                 fav: renderFav, sponsor: function(){} };

$('btn-back').onclick = () => showPicker();

function setTab(t){
  tab = t;
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  TABS.forEach(v => {
    const view = $('view-' + v);
    if (view) view.hidden = v !== t;
    const ctl = $('ctl-' + v);
    if (ctl) ctl.hidden = v !== t;
  });
  RENDER[tab]();
  updateFavBadge();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  if (history.replaceState) history.replaceState(null, '', '#' + t);
}

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  const t = e.target;

  const say = t.closest('[data-say]');
  if (say){
    const rowEl = say.closest('tr');
    speak(say.dataset.say, rowEl, say.dataset.rate ? parseFloat(say.dataset.rate) : undefined);
    return;
  }
  const mk = t.closest('[data-mk]');
  if (mk){
    const w = mk.dataset.mk;
    mastered.has(w) ? mastered.delete(w) : mastered.add(w);
    saveAll();
    if (tab === 'words') renderWords(true);
    else if (tab === 'fav') renderFav();
    return;
  }
  const fv = t.closest('[data-fav]');
  if (fv){
    const w = fv.dataset.fav;
    favWords.has(w) ? favWords.delete(w) : favWords.add(w);
    saveAll();
    if (tab === 'fav') renderFav(); else renderWords(true);
    updateFavBadge(); return;
  }
  const fmk = t.closest('[data-fmk]');
  if (fmk){
    const i = parseInt(fmk.dataset.fmk, 10);
    masteredForms.has(i) ? masteredForms.delete(i) : masteredForms.add(i);
    saveAll();
    renderFormula();
    updateFavBadge(); return;
  }
  const qfv = t.closest('[data-qfav]');
  if (qfv){
    const i = parseInt(qfv.dataset.qfav, 10);
    favForms.has(i) ? favForms.delete(i) : favForms.add(i);
    saveAll();
    if (tab === 'formula') renderFormula();
    else if (tab === 'blank') renderBlank();
    else if (tab === 'fav') renderFav();
    updateFavBadge(); return;
  }
  const tg = t.closest('[data-toggle]');
  if (tg){
    const i = parseInt(tg.dataset.toggle, 10);
    openSet.has(i) ? openSet.delete(i) : openSet.add(i);
    renderFormula(); return;
  }

  if (t.id === 'submit'){ doSubmit(); return; }
  if (t.id === 'hint'){ qHinted = true; renderBlank(); return; }
  if (t.id === 'qskip'){ qPos++; qRevealed = null; qLastInput = ''; qHinted = false; renderBlank(); return; }
  if (t.id === 'imright'){
    const pool = blankPool();
    if (pool.length){
      const key = ALL_BLANK[pool[qPos]];
      quizRec[key] = { s: 'yes', at: Date.now(), override: true };
      saveAll(); qRevealed = 'yes'; renderBlank();
    }
    return;
  }
  if (t.id === 'hintclose'){
    $('installhint').style.display = 'none';
    localStorage.setItem(K_HINT, '1'); return;
  }
  if (t.id === 'btn-info'){ openSheet(); return; }
  if (t.id === 'sheet-close' || t.classList.contains('sheet')){ closeSheet(); return; }
});

  const rm = div.querySelector('#reset-mastered');
  if (rm) rm.onclick = () => {
    if (confirm('重置进度？已掌握的词会回到全部列表（收藏保留）。')) {
      mastered = new Set(); saveAll(); closeSheet(); setTab(tab);
    }
  };
  const rb = div.querySelector('#reset-all');
  if (rb) rb.onclick = () => {
    if (confirm('清空所有「已掌握 / 收藏 / 做题记录」？')) {
      mastered = new Set(); favWords = new Set(); favForms = new Set(); quizRec = {};
      saveAll(); closeSheet(); setTab(tab);
    }
  };
}
function closeSheet(){
  const s = document.querySelector('.sheet');
  if (s) s.remove();
  document.body.classList.remove('lock');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  const tag = document.activeElement && document.activeElement.tagName;
  if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA'){
    e.preventDefault();
    if (tab !== 'words') setTab('words');
    if ((tag === 'INPUT' || tag === 'TEXTAREA')) return;
    const qi = $('q'); if (qi) qi.focus();
  }
});

/* ================= 启动 ================= */

/* pickspon-toggle：语言选择页点击赞助展开收款码 */
(function(){
  var b = document.getElementById('pick-sponsor');
  var box = document.getElementById('pickqr');
  if (!b || !box) return;
  b.addEventListener('click', function(){
    box.hidden = !box.hidden;
    b.textContent = box.hidden ? '☕ 点我赞助' : '收起收款码';
    if (!box.hidden) box.scrollIntoView({ block: 'nearest' });
  });
})();
(function init(){
  renderPicker();
  const hash = (location.hash || '').replace('#', '');
  const last = localStorage.getItem(K_LAST);
  const want = (PACKS[hash] ? hash : null) || (PACKS[last] ? last : null);
  if (want) enterLang(want); else showPicker();
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
